name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coffee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend and test dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx websockets

      - name: Smoke check startup import and seed on SQLite default
        working-directory: backend
        env:
          JWT_SECRET: ci-test-jwt-secret-key-12345
        run: |
          set -euo pipefail
          unset DATABASE_URL
          rm -f dev.db
          python -c "import app.main"
          python seed.py
          rm -f dev.db

      - name: Smoke check startup import and seed on PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coffee_test
          JWT_SECRET: ci-test-jwt-secret-key-12345
        run: |
          set -euo pipefail
          python -c "import app.main"
          python seed.py

      - name: Run pytest suite
        working-directory: backend
        env:
          JWT_SECRET: ci-test-jwt-secret-key-12345
          PYTHONPATH: .
        run: |
          set -euo pipefail
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            python -m pytest -v
          else
            echo "No test modules found under backend/tests"
          fi

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package.json') }}-${{ hashFiles('frontend/**/*.ts', 'frontend/**/*.tsx', 'frontend/next.config.js', 'frontend/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund

      - name: Build Next.js frontend and check TypeScript types
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm run build
